<!DOCTYPE html>
    <html>
    <head>
        <title>Pizza Bot Chat</title>
        <style>
            body {
                margin: 0;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                height: 100vh;
                background: linear-gradient(to bottom right, #f5f7fa, #c3cfe2);
            }
    
            #sidebar {
                width: 30%;
                background: #ffffff;
                padding: 20px;
                border-right: 2px solid #ddd;
                box-shadow: 3px 0 5px rgba(0, 0, 0, 0.1);
                overflow-y: auto;
            }
    
            #chatbox {
                width: 70%;
                padding: 20px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                background: #eef2f3;
            }
    
            h3 {
                font-size: 1.5rem;
                color: #333;
                margin-bottom: 10px;
                text-align: center;
            }
    
            #messages {
                flex: 1;
                overflow-y: auto;
                padding: 10px;
                border: 2px solid #ddd;
                background: #ffffff;
                border-radius: 8px;
                box-shadow: 0px 3px 5px rgba(0, 0, 0, 0.1);
                margin-bottom: 10px;
            }
    
            .chat-bubble {
                padding: 10px 15px;
                margin: 10px 0;
                border-radius: 15px;
                max-width: 70%;
                font-size: 1rem;
                line-height: 1.4;
            }
    
            .user-msg {
                background: #d1f7c4;
                align-self: flex-end;
                box-shadow: 2px 3px 5px rgba(0, 0, 0, 0.1);
            }
    
            .bot-msg {
                background: #f1f1f1;
                align-self: flex-start;
                box-shadow: 2px 3px 5px rgba(0, 0, 0, 0.1);
            }
    
            #user_input {
                padding: 15px;
                font-size: 1rem;
                border: 2px solid #ddd;
                border-radius: 20px;
                outline: none;
                width: 100%;
                box-shadow: 0px 3px 5px rgba(0, 0, 0, 0.1);
                transition: all 0.3s ease;
            }
    
            #user_input:focus {
                border-color: #57a773;
                box-shadow: 0px 3px 5px rgba(87, 167, 115, 0.5);
            }
    
            #history {
                font-size: 0.9rem;
                line-height: 1.6;
                color: #555;
            }
    
            #history div {
                margin-bottom: 15px;
                padding: 10px;
                background: #f7f7f7;
                border-radius: 8px;
                box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.1);
            }
    
            #history b {
                color: #333;
            }
        </style>
    </head>
    <body>
        <div id="sidebar">
            <h3>Conversation History</h3>
            <div id="history"></div>
        </div>
        <div id="chatbox">
            <div id="messages"></div>
            <input type="text" id="user_input" placeholder="Type your message..." />
        </div>
        <script>
            const userInputElement = document.getElementById('user_input');
            const messagesElement = document.getElementById('messages');
            const historyElement = document.getElementById('history');
    
            userInputElement.addEventListener('keypress', async (event) => {
                if (event.key === 'Enter') {
                    const userMessage = userInputElement.value.trim();
                    if (userMessage) {
                        appendMessage('user', userMessage);
                        userInputElement.value = '';
    
                        const response = await fetch('/api/messages', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ text: userMessage })
                        });
    
                        const data = await response.json();
                        const botMessage = data.response;
    
                        appendMessage('bot', botMessage);
                        updateHistory(data.history);
                    }
                }
            });
    
            function appendMessage(sender, message) {
                const msgElement = document.createElement('div');
                msgElement.classList.add('chat-bubble', sender === 'user' ? 'user-msg' : 'bot-msg');
                msgElement.innerText = message;
                messagesElement.appendChild(msgElement);
                messagesElement.scrollTop = messagesElement.scrollHeight;
            }
    
            function updateHistory(history) {
                historyElement.innerHTML = ""; 
                history.forEach(entry => {
                    const historyItem = document.createElement('div');
                    historyItem.innerHTML = `<b>User:</b> ${entry.user}<br><b>Bot:</b> ${entry.bot}`;
                    historyElement.appendChild(historyItem);
                });
            }
        </script>
    </body>
    </html>
